name: Weekly job search
on:
  schedule:
    # Sundays 4:00am Eastern (full run of all companies), finishing before "Recently hired" at 6am.
    # GitHub schedules run in UTC with no daylight saving, so both UTC times are listed and the
    # "Check it's 4am Eastern" step below lets only the correct one through:
    - cron: "0 8 * * 0"       # 08:00 UTC = 4am EDT (roughly March to November)
    - cron: "0 9 * * 0"       # 09:00 UTC = 4am EST (roughly November to March)
  workflow_dispatch:
    inputs:
      companies:
        description: "On-demand: company names, comma-separated (e.g. zillow, entrata, greystar). Leave blank for a full run."
        default: ""
      tier:
        description: "Full run only: tier filter (A, B, or blank for all)"
        default: ""
      detect:
        description: "Full run only: read companies with no job board on file from their careers page"
        type: boolean
        default: true
      dry_run:
        description: "Run and attach the report, but don't save anything to the repo"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # hard stop - never another 6-hour run
    steps:
      - name: Check it's 4am Eastern
        id: et
        env:
          EVENT: ${{ github.event_name }}
          FIRED: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)          # -0400 in daylight time, -0500 in standard time
          if [ "$EVENT" != "schedule" ]; then run=true      # manual runs (full or on-demand) always go
          elif [ "$FIRED" = "0 8 * * 0" ] && [ "$offset" = "-0400" ]; then run=true
          elif [ "$FIRED" = "0 9 * * 0" ] && [ "$offset" = "-0500" ]; then run=true
          else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Eastern offset $offset, schedule '$FIRED' -> run=$run"
      - uses: actions/checkout@v5
        if: steps.et.outputs.run == 'true'
      - uses: actions/setup-python@v6
        if: steps.et.outputs.run == 'true'
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        if: steps.et.outputs.run == 'true'
      # Headless browser for careers pages that only show their jobs after scripts run.
      # If this step fails the search still runs; those pages are reported instead of read.
      - name: Install the headless browser
        if: steps.et.outputs.run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Run job search
        if: steps.et.outputs.run == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          COMPANIES: ${{ github.event.inputs.companies }}
          TIER: ${{ github.event.inputs.tier }}
          DETECT: ${{ github.event.inputs.detect || 'true' }}
        run: |
          if [ -n "$COMPANIES" ]; then
            python -m jobsearch.run --only "$COMPANIES"
          else
            ARGS=""
            if [ -n "$TIER" ]; then ARGS="$ARGS --tier $TIER"; fi
            if [ "$DETECT" = "true" ]; then ARGS="$ARGS --detect"; fi
            python -m jobsearch.run $ARGS
          fi
      - name: Commit results
        if: steps.et.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "jobsearch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data output
          git commit -m "job search $(date -u +%F) ${{ github.event.inputs.companies && 'on-demand' || 'weekly run' }}" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
      - uses: actions/upload-artifact@v4
        if: steps.et.outputs.run == 'true'
        with:
          name: job-search-report
          path: output/
