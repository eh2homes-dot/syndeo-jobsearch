name: Weekly job search
on:
  schedule:
    - cron: "0 12 * * 1"      # Mondays 12:00 UTC (8am ET) - full run of all companies
  workflow_dispatch:
    inputs:
      companies:
        description: "On-demand: company names, comma-separated (e.g. zillow, entrata, greystar). Leave blank for a full run."
        default: ""
      tier:
        description: "Full run only: tier filter (A, B, or blank for all)"
        default: ""
      detect:
        description: "Full run only: auto-detect job boards for unmapped companies"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50        # hard stop - never another 6-hour run
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run job search
        env:
          PYTHONUNBUFFERED: "1"
          COMPANIES: ${{ github.event.inputs.companies }}
          TIER: ${{ github.event.inputs.tier }}
          DETECT: ${{ github.event.inputs.detect || 'true' }}
        run: |
          if [ -n "$COMPANIES" ]; then
            python -m jobsearch.run --only "$COMPANIES"
          else
            ARGS=""
            if [ -n "$TIER" ]; then ARGS="$ARGS --tier $TIER"; fi
            if [ "$DETECT" = "true" ]; then ARGS="$ARGS --detect"; fi
            python -m jobsearch.run $ARGS
          fi
      - name: Commit results
        run: |
          git config user.name "jobsearch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data output
          git commit -m "job search $(date -u +%F) ${{ github.event.inputs.companies && 'on-demand' || 'weekly run' }}" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: job-search-report
          path: output/
