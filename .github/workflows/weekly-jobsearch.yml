name: Weekly job search
on:
  schedule:
    # BACKUPS ONLY: the on-time start comes from the Supabase scheduler (see the
    # guard step). Sundays 4am Eastern (full run) and Tuesdays 5am; both UTC times
    # are listed because GitHub ignores daylight saving. The guard runs whichever
    # start comes first, once per day.
    - cron: "0 8 * * 0"       # 08:00 UTC = 4am EDT (roughly March to November)
    - cron: "0 9 * * 0"       # 09:00 UTC = 4am EST (roughly November to March)
    # Tuesdays 5am Eastern: refresh run for the Origins newsletter's Tuesday-noon final edit,
    # so roles posted since Sunday can be added before the Wednesday send.
    - cron: "0 9 * * 2"       # 09:00 UTC = 5am EDT
    - cron: "0 10 * * 2"      # 10:00 UTC = 5am EST
  workflow_dispatch:
    inputs:
      kick:
        description: "Set by the Supabase scheduler (on-time start). Runs only if today's scheduled run hasn't happened yet. Leave off for a manual run."
        type: boolean
        default: false
      companies:
        description: "On-demand: company names, comma-separated (e.g. zillow, entrata, greystar). Leave blank for a full run."
        default: ""
      tier:
        description: "Full run only: tier filter (A, B, or blank for all)"
        default: ""
      detect:
        description: "Full run only: read companies with no job board on file from their careers page"
        type: boolean
        default: true
      dry_run:
        description: "Run and attach the report, but don't save anything to the repo"
        type: boolean
        default: false

permissions:
  contents: write

# A second start (GitHub's late schedule after the on-time Supabase start, or
# the reverse) waits for the first, then sees today's output and stops.
concurrency:
  group: weekly-jobsearch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # hard stop - never another 6-hour run
    outputs:
      run: ${{ steps.et.outputs.run }}
    steps:
      # Checkout first (cheap) so the guard can see whether today's run already happened.
      - uses: actions/checkout@v5
      # ON-TIME CHAIN (Nov 2026). GitHub starts scheduled runs hours late (Nov 17:
      # the 5am Tuesday run started 1:09pm), so the Supabase scheduler starts this
      # workflow on time (Sun 4:05am, Tue 5:05am ET, input kick=true) and the OpCo
      # search and People Moves follow it by workflow_run. The schedules above stay
      # as backups. Every automatic start runs only on a Sunday or Tuesday (Eastern)
      # and only if today's output isn't in the repo yet, so whichever start comes
      # first does the run and the others stop here.
      - name: Decide whether this start should run
        id: et
        env:
          EVENT: ${{ github.event_name }}
          KICK: ${{ github.event.inputs.kick }}
        run: |
          today=$(date -u +%F)                              # output/<date>/ is named by the runner's date
          dow=$(TZ=America/New_York date +%w)
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$KICK" != "true" ]; then run=true   # manual runs always go
          elif [ "$dow" != "0" ] && [ "$dow" != "2" ]; then run=false
          elif [ -f "output/$today/all_open_roles.csv" ]; then run=false; echo "Today's search already ran (output/$today)."
          else run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "event $EVENT, kick ${KICK:-false}, Eastern weekday $dow -> run=$run"
      - uses: actions/setup-python@v6
        if: steps.et.outputs.run == 'true'
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        if: steps.et.outputs.run == 'true'
      # Headless browser for careers pages that only show their jobs after scripts run.
      # If this step fails the search still runs; those pages are reported instead of read.
      - name: Install the headless browser
        if: steps.et.outputs.run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      # Copy careers links from the live sheet into leads/master_leads.csv and
      # config/companies.csv, so a link fixed in the sheet is used this run.
      - name: Sync careers links from the sheet
        if: steps.et.outputs.run == 'true'
        continue-on-error: true
        run: python -m jobsearch.sheet_sync
      - name: Run job search
        if: steps.et.outputs.run == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          COMPANIES: ${{ github.event.inputs.companies }}
          TIER: ${{ github.event.inputs.tier }}
          DETECT: ${{ github.event.inputs.detect || 'true' }}
        run: |
          if [ -n "$COMPANIES" ]; then
            python -m jobsearch.run --only "$COMPANIES"
          else
            ARGS=""
            if [ -n "$TIER" ]; then ARGS="$ARGS --tier $TIER"; fi
            if [ "$DETECT" = "true" ]; then ARGS="$ARGS --detect"; fi
            python -m jobsearch.run $ARGS
          fi
      - name: Commit results
        if: steps.et.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "jobsearch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data output leads/master_leads.csv config/companies.csv
          git commit -m "job search $(date -u +%F) ${{ github.event.inputs.companies && 'on-demand' || 'weekly run' }}" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
      - uses: actions/upload-artifact@v4
        if: steps.et.outputs.run == 'true'
        with:
          name: job-search-report
          path: output/

  # Each company's LinkedIn page, read from the company's own website (never from LinkedIn),
  # written to output/linkedin-review.csv for review. A separate job after the search, so it can
  # never slow down or break the job search itself. Full runs only.
  linkedin:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.run == 'true' && !github.event.inputs.companies }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest, including the search's own commit
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Install the headless browser
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Find LinkedIn pages on company websites
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m jobsearch.linkedin --minutes 15
      - name: Commit results
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "jobsearch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/linkedin_found.json output/linkedin-review.csv
          git commit -m "LinkedIn pages for review $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
