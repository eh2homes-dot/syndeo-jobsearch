name: Capture Leadership Pages

# Manual only. Saves every candidate leadership / team page (plain download and
# browser-rendered) as a run artifact for building and testing the name reader.
# Changes nothing in the repo.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated company names (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture pages
        run: python tools/capture_leadership.py --only "${{ inputs.only }}"
      # Pushed to a throwaway branch (not an artifact) so it can be pulled with
      # plain git. The branch holds only the capture and is replaced each run.
      - name: Push the capture to the leadership-capture branch
        run: |
          tar czf /tmp/capture.tgz capture
          cd /tmp && rm -rf cap && mkdir cap && cd cap && git init -q -b leadership-capture
          cp /tmp/capture.tgz .
          git config user.name "syndeo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add capture.tgz && git commit -q -m "Leadership page capture $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" leadership-capture

