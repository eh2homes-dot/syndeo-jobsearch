name: Tests

# Runs the offline test suite on every change that isn't on main yet, so a
# change to the job search is checked before it is merged. No network: job
# systems are answered from recorded samples in tests/fixtures.
#
# "Live check" additionally runs both searches for real, without saving
# anything to the repo, and attaches what they found. It runs on branches whose
# name starts with "rebuild", or when started by hand from the Actions tab.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run both searches for real (nothing is saved to the repo)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests

  live-check:
    needs: tests
    permissions:
      contents: write      # only to publish results to the live-check-results branch (never main)
    if: startsWith(github.ref_name, 'rebuild') || (github.event_name == 'workflow_dispatch' && inputs.live)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Weekly search (nothing saved)
        env: { PYTHONUNBUFFERED: "1" }
        shell: bash
        run: set -o pipefail; python -m jobsearch.run --detect 2>&1 | tee weekly.log
      - name: OpCo search (nothing saved)
        if: always()
        shell: bash
        run: set -o pipefail; python opco_search.py -v 2>&1 | tee opco.log
      # The same results as the attachment below, on a branch of their own so they
      # can be read without downloading anything. Replaced on every live check.
      - name: Publish results to the live-check-results branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          mkdir -p /tmp/results/weekly /tmp/results/opco
          cp weekly.log opco.log /tmp/results/ 2>/dev/null || true
          cp -r "output/$today"/. /tmp/results/weekly/ 2>/dev/null || true
          cp output/newsletter/now-hiring-"$today".md /tmp/results/weekly/ 2>/dev/null || true
          cp out/opco-jobs-latest.md out/opco-jobs-latest.json out/opco-jobs-all-"$today".csv /tmp/results/opco/ 2>/dev/null || true
          cp data/ats_map.json data/needs_manual_mapping.csv /tmp/results/ 2>/dev/null || true
          cd /tmp/results
          git init -q -b live-check-results
          git config user.name "jobsearch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Live check of ${GITHUB_SHA::7} on $today (nothing here is used by the searches)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" live-check-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: |
            weekly.log
            opco.log
            output/
            out/
            data/ats_map.json
            data/needs_manual_mapping.csv
          retention-days: 30
