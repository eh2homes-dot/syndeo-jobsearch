name: People Moves

# When it runs (Nov 2026, the on-time chain):
#   Sunday   full scan, right after the OpCo search finishes (the Supabase
#            scheduler starts the weekly job search at 4:05am ET; OpCo follows it,
#            and this follows OpCo)
#   Tuesday  light refresh (every source, last 4 days for news and filings),
#            the same way after the Tuesday 5:05am job search and OpCo
#   Friday   light refresh, started by the Supabase scheduler at 3:05pm ET
# The schedules below are backups for when a chained start doesn't come; the
# guard step lets one run per day through. GitHub ignores daylight saving, so
# each backup time is listed in both UTC offsets.
on:
  schedule:
    - cron: "0 10 * * 0"      # backup: 6am EDT Sunday
    - cron: "0 11 * * 0"      # backup: 6am EST Sunday
    - cron: "17 18 * * 0"     # backup: Sunday ~2pm ET, only if the 6am run left no output
    - cron: "17 8 * * 1"      # backup: Monday ~4am ET, only if still nothing this week
    - cron: "0 11 * * 2"      # backup light refresh: 7am EDT Tuesday
    - cron: "0 12 * * 2"      # backup light refresh: 7am EST Tuesday
    - cron: "0 19 * * 5"      # backup light refresh: 3pm EDT Friday
    - cron: "0 20 * * 5"      # backup light refresh: 3pm EST Friday
  # ON-TIME CHAIN (Nov 2026): Sunday and Tuesday, starts as soon as the OpCo
  # search finishes (which follows the weekly job search, which the Supabase
  # scheduler starts on time). Friday: the Supabase scheduler starts it at 3:05pm
  # ET (kick=true). The schedules above are backups.
  workflow_run:
    workflows: ["OpCo Job Search"]
    types: [completed]
  workflow_dispatch:
    inputs:
      kick:
        description: "Set by the Supabase scheduler (on-time start). Runs only if today's scheduled run hasn't happened yet. Leave off for a manual run."
        type: boolean
        default: false
      backfill:
        description: "Run the one-off Wayback baseline instead of a weekly scan"
        type: boolean
        default: false
      lookback_days:
        description: "How many days back to look for news and filings"
        default: "8"
      sources:
        description: "Comma-separated: edgar,formd,leadership,news,trade,reqs"
        default: "edgar,formd,leadership,news,trade,reqs"
      discover_leadership:
        description: "Instead of a scan, look for leadership pages for companies that have none (writes out/leadership-discovery.csv for review)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: people-moves
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150      # includes up to 40 minutes waiting for the OpCo results

    steps:
      # Checkout comes first (it is cheap) so the guard can see the latest output.
      - uses: actions/checkout@v4

      # Every automatic start (after OpCo, the Friday on-time start, or a backup
      # schedule) goes through this guard, by Eastern weekday:
      #  - Sunday: the full weekly scan, if today's output isn't in yet.
      #  - Monday: backup full scan, only if this week's Sunday scan never ran.
      #  - Tuesday and Friday: the light refresh, if today's output isn't in yet.
      #  - Any other day: stop.
      # Whichever start comes first does the run; the rest stop here.
      - name: Decide whether this trigger should run
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          KICK: ${{ github.event.inputs.kick }}
        run: |
          today=$(date -u +%F)                         # output files are named by the runner's date
          dow=$(TZ=America/New_York date +%w)
          sunday=$(date -d "$(TZ=America/New_York date +%F) -$dow days" +%F)   # this week's Sunday
          latest=$(find . -path ./.git -prune -o -type f -name 'people-moves-20*.json' -print | sed -E 's/.*people-moves-([0-9-]{10})\.json/\1/' | sort | tail -1)
          echo "Latest People Moves output: ${latest:-none} (today $today, this week's Sunday: $sunday)"
          light=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$KICK" != "true" ]; then run=true   # manual runs always go
          elif [ "$latest" = "$today" ]; then run=false; echo "Today's scan already ran."
          elif [ "$dow" = "0" ]; then run=true
          elif [ "$dow" = "1" ]; then
            if [ -z "$latest" ] || [[ "$latest" < "$sunday" ]]; then
              run=true; echo "::warning::Backup run: this week's Sunday scan left no output."
            else run=false; fi
          elif [ "$dow" = "2" ] || [ "$dow" = "5" ]; then run=true; light=true
          else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "light=$light" >> "$GITHUB_OUTPUT"
          echo "event $EVENT, kick ${KICK:-false}, Eastern weekday $dow -> run=$run, light=$light"

      # The OpCo search runs at the same 6am slot and its results feed the job
      # signals. On scheduled runs, wait (up to 40 minutes) for this week's OpCo
      # results to land on the branch, then pull them, so the signals don't run
      # a week behind. Manual runs use whatever is there.
      - name: Wait for this week's OpCo results
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.light != 'true' && github.event_name == 'schedule'
        run: |
          today=$(date -u +%F)
          for i in $(seq 1 40); do
            git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
            got=$(git show "origin/${GITHUB_REF_NAME}:out/opco-jobs-latest.json" 2>/dev/null \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('run_date',''))" 2>/dev/null)
            if [ -n "$got" ] && ! [[ "$got" < "$(date -u -d "$today -1 day" +%F)" ]]; then
              echo "OpCo results from $got are in."
              # Nothing has been written yet, so just move to the newest commit.
              git reset -q --hard "origin/${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "OpCo results on the branch are from ${got:-never}; waiting a minute ($i/40)"
            sleep 60
          done
          echo "::warning::This week's OpCo results never arrived; job signals use the last ones on file."

      # The module runs from the repo root, next to the job searches. (Older
      # copies used to sit under people-moves/, and a "find the first copy"
      # lookup landed on a 13-company sample list. Those copies are gone.)
      - name: Locate the module
        if: steps.guard.outputs.run == 'true'
        id: locate
        run: |
          DIR="."
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          MISSING=""
          for f in run.py report.py requirements.txt config/feeds.yml config/companies.csv \
                   leads/master_leads.csv opco.csv discover_leadership.py \
                   lib/http.py lib/companies.py lib/people.py lib/move.py \
                   lib/state.py sources/edgar.py sources/leadership.py sources/news_rss.py \
                   sources/trade_press.py sources/req_signals.py \
                   sources/wayback.py jobsearch/browser.py; do
            [ -f "$DIR/$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::People Moves is missing these files at the repo root:$MISSING"
            exit 1
          fi

          # Job-search outputs for the inference signals: the weekly search's
          # newest dated folder (not on-demand runs) and the OpCo search.
          JOBS=""
          LATEST=$(ls -d output/20??-??-??/ 2>/dev/null | sort | tail -1)
          [ -n "$LATEST" ] && [ -f "${LATEST}all_open_roles.csv" ] && JOBS="${GITHUB_WORKSPACE}/${LATEST}all_open_roles.csv"
          [ -f out/opco-jobs-latest.json ] && JOBS="${JOBS:+$JOBS,}${GITHUB_WORKSPACE}/out/opco-jobs-latest.json"
          echo "Job-search outputs: ${JOBS:-none found}"
          [ -f out/opco-jobs-latest.json ] && python3 -c "import json; print('  OpCo results dated', json.load(open('out/opco-jobs-latest.json')).get('run_date'))" || true
          [ -n "$LATEST" ] && echo "  weekly search folder: $LATEST"
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ steps.locate.outputs.dir }}/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r "${{ steps.locate.outputs.dir }}/requirements.txt"

      # Headless browser for leadership pages whose names load with scripts.
      # If this fails the scan still runs; those pages are skipped as before.
      - name: Install the headless browser
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Sync careers links from the sheet
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.dir }}
        run: python -m jobsearch.sheet_sync

      - name: Run scan
        if: steps.guard.outputs.run == 'true'
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          # SEC requires a descriptive User-Agent with contact info.
          PEOPLE_MOVES_UA: "Syndeo People-Moves Research (hello@syndeollc.com)"
          # The weekly and OpCo job-search outputs, found in "Locate the module".
          JOBS_RESULTS_PATH: ${{ steps.locate.outputs.jobs }}
          # Database writers. NOT USED by the live run.py: the Airtable and
          # Supabase writers are in unwired/people-moves/ and nothing calls them.
          # The secrets stay here so switching them on needs no workflow change.
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.discover_leadership }}" = "true" ]; then
            python discover_leadership.py
          elif [ "${{ inputs.backfill }}" = "true" ]; then
            python run.py --backfill --backfill-days 120
          elif [ "${{ steps.guard.outputs.light }}" = "true" ]; then
            # Light refresh: announcements from the last 4 days, plus the
            # leadership pages and the job-board signals (each change since the
            # last read is reported once, then the saved state moves on). The
            # job searches run Sunday and Tuesday, so Friday's job-board check
            # finds nothing new unless a search ran since Tuesday.
            python run.py --sources "edgar,formd,leadership,news,trade,reqs" --lookback-days 4
          else
            python run.py \
              --sources "${{ inputs.sources || 'edgar,formd,leadership,news,trade,reqs' }}" \
              --lookback-days "${{ inputs.lookback_days || 8 }}"
          fi

      - name: Commit state and output
        if: steps.guard.outputs.run == 'true'
        env:
          DIR: ${{ steps.locate.outputs.dir }}
        run: |
          git config user.name  "syndeo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$DIR/state" "$DIR/out" 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nothing changed this week."
          else
            git commit -m "People moves: $(date -u +%Y-%m-%d)"
            # Another workflow may have pushed while we ran; retry like OpCo does.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "Push attempt $attempt failed; retrying in 15s"
              sleep 15
            done
            echo "::error::Could not push results after 3 attempts."
            exit 1
          fi

      - name: Upload brief
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: people-moves-brief
          path: |
            ${{ steps.locate.outputs.dir }}/out/people-moves-*.md
            ${{ steps.locate.outputs.dir }}/out/people-moves-*.json
          retention-days: 90
          if-no-files-found: warn
