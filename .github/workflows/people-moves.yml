name: People Moves

# Sundays at 6:00am ET, with Sunday-afternoon and early-Monday backups that run
# only if that week's output is still missing (see the guard step).
#
# GitHub cron is UTC and does not observe daylight saving, so a single UTC time
# drifts by an hour twice a year. Two schedules are declared (10:00 UTC = 6am
# EDT, 11:00 UTC = 6am EST) and the guard step exits on whichever one is not
# actually 6am in New York. One real run per Sunday, all year.
on:
  schedule:
    - cron: "0 10 * * 0"      # 6am EDT Sunday (main run, roughly March to November)
    - cron: "0 11 * * 0"      # 6am EST Sunday (main run, roughly November to March)
    - cron: "17 18 * * 0"     # backup: Sunday ~2pm ET, only if the 6am run left no output
    - cron: "17 8 * * 1"      # backup: Monday ~4am ET, only if still nothing this week
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run the one-off Wayback baseline instead of a weekly scan"
        type: boolean
        default: false
      lookback_days:
        description: "How many days back to look for news and filings"
        default: "8"
      sources:
        description: "Comma-separated: edgar,leadership,news,trade,reqs"
        default: "edgar,leadership,news,trade,reqs"
      discover_leadership:
        description: "Instead of a scan, look for leadership pages for companies that have none (writes out/leadership-discovery.csv for review)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: people-moves
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150      # includes up to 40 minutes waiting for the OpCo results

    steps:
      # Checkout comes first (it is cheap) so the guard can see the latest output.
      - uses: actions/checkout@v4

      # Decide by WHICH schedule fired, never by the clock: GitHub often starts
      # scheduled runs hours late, and a clock check then skips the week.
      #  - Sunday 6am slots: the one matching the current daylight-saving side runs.
      #  - Backup slots (Sunday afternoon, early Monday): run only if this week's
      #    People Moves output is still missing, i.e. GitHub dropped or failed the 6am run.
      #    The Monday backup lands before the browser pass and the newsletter build.
      - name: Decide whether this trigger should run
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          FIRED: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)          # -0400 in daylight time, -0500 in standard time
          today=$(TZ=America/New_York date +%F)
          sunday=$(date -d "$today -$(TZ=America/New_York date +%w) days" +%F)   # this week's Sunday
          latest=$(find . -path ./.git -prune -o -type f -name 'people-moves-20*.json' -print | sed -E 's/.*people-moves-([0-9-]{10})\.json/\1/' | sort | tail -1)
          echo "Latest People Moves output: ${latest:-none} (this week's Sunday: $sunday)"
          if [ "$EVENT" != "schedule" ]; then run=true     # manual runs always go
          elif [ "$FIRED" = "0 10 * * 0" ] && [ "$offset" = "-0400" ]; then run=true
          elif [ "$FIRED" = "0 11 * * 0" ] && [ "$offset" = "-0500" ]; then run=true
          elif [ "$FIRED" = "17 18 * * 0" ] || [ "$FIRED" = "17 8 * * 1" ]; then
            if [ -z "$latest" ] || [[ "$latest" < "$sunday" ]]; then
              run=true; echo "::warning::Backup run: this week's 6am run left no output."
            else run=false; fi
          else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Eastern offset $offset, schedule '$FIRED' -> run=$run"

      # The OpCo search runs at the same 6am slot and its results feed the job
      # signals. On scheduled runs, wait (up to 40 minutes) for this week's OpCo
      # results to land on the branch, then pull them, so the signals don't run
      # a week behind. Manual runs use whatever is there.
      - name: Wait for this week's OpCo results
        if: steps.guard.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          today=$(date -u +%F)
          for i in $(seq 1 40); do
            git fetch -q --depth 1 origin "${GITHUB_REF_NAME}"
            got=$(git show "origin/${GITHUB_REF_NAME}:out/opco-jobs-latest.json" 2>/dev/null \
                  | python3 -c "import json,sys; print(json.load(sys.stdin).get('run_date',''))" 2>/dev/null)
            if [ -n "$got" ] && ! [[ "$got" < "$(date -u -d "$today -1 day" +%F)" ]]; then
              echo "OpCo results from $got are in."
              # Nothing has been written yet, so just move to the newest commit.
              git reset -q --hard "origin/${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "OpCo results on the branch are from ${got:-never}; waiting a minute ($i/40)"
            sleep 60
          done
          echo "::warning::This week's OpCo results never arrived; job signals use the last ones on file."

      # The module runs from the repo root, next to the job searches. Older
      # copies under people-moves/ are not used (a "find the first copy" lookup
      # used to land on a 13-company sample list).
      - name: Locate the module
        if: steps.guard.outputs.run == 'true'
        id: locate
        run: |
          DIR="."
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          MISSING=""
          for f in run.py report.py requirements.txt config/feeds.yml config/companies.csv \
                   leads/master_leads.csv opco.csv discover_leadership.py \
                   lib/http.py lib/companies.py lib/people.py lib/move.py \
                   lib/state.py sources/edgar.py sources/leadership.py sources/news_rss.py \
                   sources/trade_press.py sources/req_signals.py \
                   sources/wayback.py jobsearch/browser.py; do
            [ -f "$DIR/$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::People Moves is missing these files at the repo root:$MISSING"
            exit 1
          fi

          # Job-search outputs for the inference signals: the weekly search's
          # newest dated folder (not on-demand runs) and the OpCo search.
          JOBS=""
          LATEST=$(ls -d output/20??-??-??/ 2>/dev/null | sort | tail -1)
          [ -n "$LATEST" ] && [ -f "${LATEST}all_open_roles.csv" ] && JOBS="${GITHUB_WORKSPACE}/${LATEST}all_open_roles.csv"
          [ -f out/opco-jobs-latest.json ] && JOBS="${JOBS:+$JOBS,}${GITHUB_WORKSPACE}/out/opco-jobs-latest.json"
          echo "Job-search outputs: ${JOBS:-none found}"
          [ -f out/opco-jobs-latest.json ] && python3 -c "import json; print('  OpCo results dated', json.load(open('out/opco-jobs-latest.json')).get('run_date'))" || true
          [ -n "$LATEST" ] && echo "  weekly search folder: $LATEST"
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ steps.locate.outputs.dir }}/requirements.txt

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r "${{ steps.locate.outputs.dir }}/requirements.txt"

      # Headless browser for leadership pages whose names load with scripts.
      # If this fails the scan still runs; those pages are skipped as before.
      - name: Install the headless browser
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Run scan
        if: steps.guard.outputs.run == 'true'
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          # SEC requires a descriptive User-Agent with contact info.
          PEOPLE_MOVES_UA: "Syndeo People-Moves Research (hello@syndeollc.com)"
          # The weekly and OpCo job-search outputs, found in "Locate the module".
          JOBS_RESULTS_PATH: ${{ steps.locate.outputs.jobs }}
        run: |
          if [ "${{ inputs.discover_leadership }}" = "true" ]; then
            python discover_leadership.py
          elif [ "${{ inputs.backfill }}" = "true" ]; then
            python run.py --backfill --backfill-days 120
          else
            python run.py \
              --sources "${{ inputs.sources || 'edgar,leadership,news,trade,reqs' }}" \
              --lookback-days "${{ inputs.lookback_days || 8 }}"
          fi

      - name: Commit state and output
        if: steps.guard.outputs.run == 'true'
        env:
          DIR: ${{ steps.locate.outputs.dir }}
        run: |
          git config user.name  "syndeo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$DIR/state" "$DIR/out" 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nothing changed this week."
          else
            git commit -m "People moves: $(date -u +%Y-%m-%d)"
            # Another workflow may have pushed while we ran; retry like OpCo does.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "Push attempt $attempt failed; retrying in 15s"
              sleep 15
            done
            echo "::error::Could not push results after 3 attempts."
            exit 1
          fi

      - name: Upload brief
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: people-moves-brief
          path: |
            ${{ steps.locate.outputs.dir }}/out/people-moves-*.md
            ${{ steps.locate.outputs.dir }}/out/people-moves-*.json
          retention-days: 90
          if-no-files-found: warn
