name: OpCo Job Search

# Reads the job board (or careers page) in Column D of the OpCo tab for every
# company, lists the open roles with links to each posting, and writes the
# weekly brief. Column D is the only input. A careers page is read through the
# job board it loads; nothing is guessed from a company's name.
#
# Runs Sundays at 6:00am ET. GitHub's schedule runs on UTC with no daylight
# saving, so two times are listed (10:00 UTC = 6am EDT, 11:00 UTC = 6am EST) and
# the guard step keeps whichever matches. Two backup times (Sunday afternoon,
# early Monday) run only if that week's output is still missing.
on:
  schedule:
    - cron: "0 10 * * 0"      # 6am EDT Sunday (main run, roughly March to November)
    - cron: "0 11 * * 0"      # 6am EST Sunday (main run, roughly November to March)
    - cron: "17 18 * * 0"     # backup: Sunday ~2pm ET, only if the 6am run left no output
    - cron: "17 8 * * 1"      # backup: Monday ~4am ET, only if still nothing this week
  workflow_dispatch:
    inputs:
      only:
        description: "Only these companies, comma-separated (leave blank for all)"
        default: ""
      dry_run:
        description: "Run and attach the brief, but don't save anything to the repo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: opco-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checkout comes first (it is cheap) so the guard can see the latest output.
      - uses: actions/checkout@v4

      # Decide by WHICH schedule fired, never by the clock: GitHub often starts
      # scheduled runs hours late, and a clock check then skips the week.
      #  - Sunday 6am slots: the one matching the current daylight-saving side runs.
      #  - Backup slots (Sunday afternoon, early Monday): run only if this week's
      #    OpCo output is still missing, i.e. GitHub dropped or failed the 6am run.
      #    The Monday backup lands before the browser pass and the newsletter build.
      - name: Decide whether this trigger should run
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          FIRED: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/New_York date +%z)          # -0400 in daylight time, -0500 in standard time
          today=$(TZ=America/New_York date +%F)
          sunday=$(date -d "$today -$(TZ=America/New_York date +%w) days" +%F)   # this week's Sunday
          latest=$(python3 -c "import json,glob;p=sorted(glob.glob('**/out/opco-jobs-latest.json',recursive=True));print(json.load(open(p[0])).get('run_date','') if p else '')" 2>/dev/null)
          echo "Latest OpCo output: ${latest:-none} (this week's Sunday: $sunday)"
          if [ "$EVENT" != "schedule" ]; then run=true     # manual runs always go
          elif [ "$FIRED" = "0 10 * * 0" ] && [ "$offset" = "-0400" ]; then run=true
          elif [ "$FIRED" = "0 11 * * 0" ] && [ "$offset" = "-0500" ]; then run=true
          elif [ "$FIRED" = "17 18 * * 0" ] || [ "$FIRED" = "17 8 * * 1" ]; then
            if [ -z "$latest" ] || [[ "$latest" < "$sunday" ]]; then
              run=true; echo "::warning::Backup run: this week's 6am run left no output."
            else run=false; fi
          else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Eastern offset $offset, schedule '$FIRED' -> run=$run"

      - name: Find the script, its config and the company list
        if: steps.guard.outputs.run == 'true'
        id: locate
        run: |
          SCRIPT=$(find . -type f -name 'opco_search.py' -not -path './.git/*' | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::opco_search.py not found in the repo."
            exit 1
          fi
          DIR=$(dirname "$SCRIPT"); DIR=${DIR#./}; [ -z "$DIR" ] && DIR="."
          if [ ! -f "$DIR/opco_config.yml" ]; then
            echo "::error::opco_config.yml must sit in the same folder as opco_search.py ($DIR)."
            exit 1
          fi
          echo "Script: $SCRIPT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          # The script reads the live Google Sheet when opco_config.yml has its
          # link, and falls back to opco.csv in the repo otherwise.
          if grep -qE '^sheet_csv_url:[[:space:]]*https?://' "$DIR/opco_config.yml"; then
            echo "Company list: the live Google Sheet (opco.csv is the fallback)"
          elif [ -z "$(find . -type f -iname 'opco.csv' -not -path './.git/*' | head -1)" ]; then
            echo "::error::No company list: set sheet_csv_url in opco_config.yml, or commit opco.csv."
            exit 1
          else
            echo "Company list: opco.csv in the repo"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install "requests>=2.31" "beautifulsoup4>=4.12" "lxml>=5.0" "PyYAML>=6.0" "playwright>=1.45"

      # Headless browser for careers pages that only show their jobs after scripts run.
      # If this step fails the search still runs; those pages are reported instead of read.
      - name: Install the headless browser
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Read jobs from each company's Column D
        if: steps.guard.outputs.run == 'true'
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python opco_search.py --only "$ONLY"
          else
            python opco_search.py
          fi

      # The people-moves workflow also commits on Sundays, so retry the push.
      # -A stages removals too (the first run deletes the old version's state files).
      - name: Save results to the repo
        if: steps.guard.outputs.run == 'true' && inputs.dry_run != true
        env:
          DIR: ${{ steps.locate.outputs.dir }}
        run: |
          git config user.name  "syndeo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$DIR/state" "$DIR/out" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "OpCo job search: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Could not push results after 3 attempts."
          exit 1

      - name: Attach the brief and job lists to this run
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opco-job-search
          path: |
            ${{ steps.locate.outputs.dir }}/out/opco-jobs-*.md
            ${{ steps.locate.outputs.dir }}/out/opco-jobs-*.csv
            ${{ steps.locate.outputs.dir }}/out/opco-jobs-latest.json
          retention-days: 90
          if-no-files-found: warn
