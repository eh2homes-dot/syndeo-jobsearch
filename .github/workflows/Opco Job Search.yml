name: OpCo Job Search

# Reads the job board (or careers page) in Column D of the OpCo tab for every
# company, lists the open roles with links to each posting, and writes the
# weekly brief. Column D is the only input. A careers page is read through the
# job board it loads; nothing is guessed from a company's name.
#
# Runs Sundays at 6:00am ET. GitHub's schedule runs on UTC with no daylight
# saving, so two times are listed (10:00 UTC = 6am EDT, 11:00 UTC = 6am EST) and
# the first step skips whichever one isn't 6am in New York.
on:
  schedule:
    - cron: "0 10 * * 0"
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these companies, comma-separated (leave blank for all)"
        default: ""
      dry_run:
        description: "Run and attach the brief, but don't save anything to the repo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: opco-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Skip if this is the wrong side of daylight saving
        id: guard
        run: |
          HOUR=$(TZ=America/New_York date +%-H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" != "6" ]; then
            echo "It is ${HOUR}:00 in New York, not 6am. Skipping this trigger."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - name: Find the script, its config and the company list
        if: steps.guard.outputs.run == 'true'
        id: locate
        run: |
          SCRIPT=$(find . -type f -name 'opco_search.py' -not -path './.git/*' | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::opco_search.py not found in the repo."
            exit 1
          fi
          DIR=$(dirname "$SCRIPT"); DIR=${DIR#./}; [ -z "$DIR" ] && DIR="."
          if [ ! -f "$DIR/opco_config.yml" ]; then
            echo "::error::opco_config.yml must sit in the same folder as opco_search.py ($DIR)."
            exit 1
          fi
          echo "Script: $SCRIPT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          # The script reads the live Google Sheet when opco_config.yml has its
          # link, and falls back to opco.csv in the repo otherwise.
          if grep -qE '^sheet_csv_url:[[:space:]]*https?://' "$DIR/opco_config.yml"; then
            echo "Company list: the live Google Sheet (opco.csv is the fallback)"
          elif [ -z "$(find . -type f -iname 'opco.csv' -not -path './.git/*' | head -1)" ]; then
            echo "::error::No company list: set sheet_csv_url in opco_config.yml, or commit opco.csv."
            exit 1
          else
            echo "Company list: opco.csv in the repo"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install "requests>=2.31" "beautifulsoup4>=4.12" "lxml>=5.0" "PyYAML>=6.0" "playwright>=1.45"

      # Headless browser for careers pages that only show their jobs after scripts run.
      # If this step fails the search still runs; those pages are reported instead of read.
      - name: Install the headless browser
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Read jobs from each company's Column D
        if: steps.guard.outputs.run == 'true'
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python opco_search.py --only "$ONLY"
          else
            python opco_search.py
          fi

      # The people-moves workflow also commits on Sundays, so retry the push.
      # -A stages removals too (the first run deletes the old version's state files).
      - name: Save results to the repo
        if: steps.guard.outputs.run == 'true' && inputs.dry_run != true
        env:
          DIR: ${{ steps.locate.outputs.dir }}
        run: |
          git config user.name  "syndeo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A "$DIR/state" "$DIR/out" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "OpCo job search: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Could not push results after 3 attempts."
          exit 1

      - name: Attach the brief and job lists to this run
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opco-job-search
          path: |
            ${{ steps.locate.outputs.dir }}/out/opco-jobs-*.md
            ${{ steps.locate.outputs.dir }}/out/opco-jobs-*.csv
            ${{ steps.locate.outputs.dir }}/out/opco-jobs-latest.json
          retention-days: 90
          if-no-files-found: warn
